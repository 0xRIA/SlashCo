    // スラッシャーアバター画像 (ローカル優先 ＆ CDNフォールバック付き)
    function SlasherAvatar({ slasher, className = "w-full h-full object-cover" }) {
      const [imgSrc, setImgSrc] = useState(slasher.iconUrl || slasher.cdnUrl);
      const [failed, setFailed] = useState(false);

      React.useEffect(() => {
        setImgSrc(slasher.iconUrl || slasher.cdnUrl);
        setFailed(false);
      }, [slasher.id, slasher.iconUrl, slasher.cdnUrl]);

      const handleError = () => {
        if (slasher.cdnUrl && imgSrc !== slasher.cdnUrl) {
          setImgSrc(slasher.cdnUrl);
        } else {
          setFailed(true);
        }
      };

      if (failed || !imgSrc) {
        const bg =
          slasher.class === 'CRYPTID' ? 'bg-gradient-to-br from-green-950 via-zinc-900 to-black text-green-400 border-green-500/40' :
          slasher.class === 'DEMON' ? 'bg-gradient-to-br from-red-950 via-zinc-900 to-black text-red-400 border-red-500/40' :
          slasher.class === 'UMBRA' ? 'bg-gradient-to-br from-fuchsia-950 via-zinc-900 to-black text-fuchsia-400 border-fuchsia-500/40' :
          'bg-gradient-to-br from-zinc-900 via-zinc-800 to-black text-zinc-300 border-zinc-600/40';

        return (
          <div className={`w-full h-full rounded-lg border flex flex-col items-center justify-center p-1 text-center font-mono ${bg}`}>
            <span className="text-xs sm:text-sm font-black tracking-wider uppercase">{slasher.name.slice(0, 2)}</span>
            <span className="text-[7px] sm:text-[8px] opacity-70 truncate max-w-full font-bold">{slasher.class}</span>
          </div>
        );
      }

      return (
        <img
          src={imgSrc}
          alt={slasher.name}
          onError={handleError}
          className={className}
          loading="lazy"
        />
      );
    }

    // =========================================================================
    // スラッシャー速度解析＆サバイバー比較ロジック
    // =========================================================================
    function getSpeedInfo(slasher) {
      const rawChase = (slasher?.stats?.chaseSpeed || '').toString();
      const rawWalk = (slasher?.stats?.walkSpeed || '').toString();

      // 特殊エンティティ (The Hat Man など)
      const matchChase = rawChase.match(/([0-9]+(?:\.[0-9]+)?)/);
      if (!matchChase) {
        return {
          isSpecial: true,
          minSpeed: null,
          maxSpeed: null,
          walkSpeed: null,
          baseChaseSpeed: null,
          speedRangeLabel: '特殊',
          badgeClass: 'text-zinc-400 bg-zinc-800/90 border-zinc-700',
          badgeText: '特殊',
          description: '通常の移動速度判定はありません。サバイバーが視界に捉え続けることでテレポート＆一時無力化させます。'
        };
      }

      let baseChaseSpeed = parseFloat(matchChase[1]);
      let maxSpeed = baseChaseSpeed;

      if (slasher.id === 'speedrunner' || rawChase.includes('7.0')) {
        maxSpeed = 7.0;
      } else {
        const plusMatch = rawChase.match(/\(\+([0-9.]+)/);
        if (plusMatch) {
          maxSpeed = +(baseChaseSpeed + parseFloat(plusMatch[1])).toFixed(2);
        }
      }

      // 通常歩行速度
      const matchWalk = rawWalk.match(/([0-9]+(?:\.[0-9]+)?)/);
      const walkSpeed = matchWalk ? parseFloat(matchWalk[1]) : null;

      // 最低速度 (Speedrunnerは0.6、歩行があれば歩行速度、なければチェイス初速)
      let minSpeed = baseChaseSpeed;
      if (slasher.id === 'speedrunner') {
        minSpeed = 0.6;
      } else if (walkSpeed !== null) {
        minSpeed = walkSpeed;
      }

      let speedRangeLabel = minSpeed === maxSpeed ? `${maxSpeed} m/s` : `${minSpeed} ~ ${maxSpeed} m/s`;
      let badgeClass = maxSpeed >= 5.0
        ? 'text-red-400 bg-red-950/70 border-red-500/50 font-bold'
        : maxSpeed >= 4.0
        ? 'text-amber-400 bg-amber-950/60 border-amber-500/50 font-bold'
        : 'text-cyan-400 bg-cyan-950/60 border-cyan-500/50 font-bold';

      return {
        isSpecial: false,
        minSpeed,
        maxSpeed,
        walkSpeed,
        baseChaseSpeed,
        speedRangeLabel,
        badgeClass,
        badgeText: speedRangeLabel,
        description: minSpeed === maxSpeed
          ? `移動速度は一定で ${maxSpeed} m/s です。`
          : `索敵・歩行時の最低速度は ${minSpeed} m/s、追跡・激怒時は最大 ${maxSpeed} m/s まで加速します。`
      };
    }

    // スラッシャー速度バー表示コンポーネント (最低速度 & 最高速度)
    function SpeedAnalysisBlock({ slasher }) {
      const speed = getSpeedInfo(slasher);
      const MAX_SCALE = 7.0; // 全スラッシャー中最高速度 (Speedrunner 7.0 m/s)

      if (speed.isSpecial) {
        return (
          <div className="bg-zinc-900/90 rounded-2xl p-4 border border-zinc-800 space-y-2 shadow-xl">
            <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
              <span className="text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider flex items-center gap-1.5">
                スラッシャー移動速度
              </span>
              <span className="text-[10px] font-mono font-black px-2 py-0.5 rounded-lg border text-zinc-300 border-zinc-600 bg-zinc-800">
                特殊エンティティ
              </span>
            </div>
            <div className="p-3 rounded-xl border border-zinc-700 bg-zinc-950/90 text-xs font-mono text-zinc-300 space-y-1">
              <div className="flex items-center gap-2 text-white font-bold">
                <span className="w-2 h-2 rounded-full bg-zinc-400"></span>

              </p>
            </div>
          </div>
        );
      }

      const minPct = Math.min(100, (speed.minSpeed / MAX_SCALE) * 100);
      const maxPct = Math.min(100, (speed.maxSpeed / MAX_SCALE) * 100);

      return (
        <div className="bg-zinc-900/90 rounded-2xl p-4 border border-zinc-800 space-y-3.5 shadow-xl">
          {/* 見出し ＆ レンジ表示 */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-zinc-800 pb-2.5">
            <div className="text-xs font-mono font-bold text-zinc-200 uppercase tracking-wider flex items-center gap-1.5">
              スラッシャー移動速度 (最低速度 〜 最高速度)
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono font-bold px-2.5 py-1 rounded-xl bg-zinc-800 border border-zinc-700 text-zinc-100 flex items-center gap-1.5 shadow-sm">
                速度レンジ: <span className="text-amber-400 font-black">{speed.speedRangeLabel}</span>
              </span>
            </div>
          </div>

          {/* 速度バー表示エリア */}
          <div className="bg-black/90 rounded-xl p-3.5 border border-zinc-800/90 space-y-3 relative overflow-hidden">
            {/* 1. 最低速度バー */}
            <div className="space-y-1">
              <div className="flex justify-between text-xs font-mono">
                <span className="text-cyan-400 font-bold flex items-center gap-1.5">
                  最低速度 {speed.walkSpeed ? '(歩行・索敵時)' : '(初速)'}
                </span>
                <span className="text-cyan-400 font-black">{speed.minSpeed} m/s</span>
              </div>
              <div className="w-full bg-zinc-900 h-3 rounded-full overflow-hidden relative border border-zinc-800 p-0.5">
                <div
                  className="bg-gradient-to-r from-cyan-600 to-cyan-400 h-full rounded-full transition-all duration-300 shadow-[0_0_8px_rgba(34,211,238,0.4)]"
                  style={{ width: `${minPct}%` }}
                ></div>
              </div>
            </div>

            {/* 2. 最高速度バー */}
            <div className="space-y-1">
              <div className="flex justify-between text-xs font-mono">
                <span className="text-rose-400 font-bold flex items-center gap-1.5">
                  最高速度 (追跡・激怒時)
                </span>
                <span className="text-rose-400 font-black">{speed.maxSpeed} m/s</span>
              </div>
              <div className="w-full bg-zinc-900 h-3 rounded-full overflow-hidden relative border border-zinc-800 p-0.5">
                <div
                  className="bg-gradient-to-r from-orange-500 to-rose-500 h-full rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(244,63,94,0.5)]"
                  style={{ width: `${maxPct}%` }}
                ></div>
              </div>
            </div>

            {/* スケール目盛り (0 〜 7.0 m/s) */}
            <div className="flex justify-between text-[9px] font-mono text-zinc-500 px-0.5 border-t border-zinc-800/80 pt-1.5">
              <span>0 m/s</span>
              <span>1.75 m/s</span>
              <span>3.5 m/s</span>
              <span>5.25 m/s</span>
              <span>7.0 m/s (MAX)</span>
            </div>
          </div>

          {/* 3分割 速度メトリクスカード (プレイヤー比較なし) */}
          <div className="grid grid-cols-3 gap-2 text-center font-mono">
            <div className="bg-zinc-950/80 p-2.5 rounded-xl border border-zinc-800/80">

              <div className="text-xs font-black text-cyan-400 mt-1">{speed.baseChaseSpeed} m/s</div>

              <div className="text-xs font-black text-rose-400 mt-1">{speed.maxSpeed} m/s</div>
            </div>
          </div>
        </div>
      );

      // フィルタリング
      const filteredSlashers = useMemo(() => {
        return SLASHERS_DATA.filter(s => {
          if (classFilter !== 'ALL' && s.class !== classFilter) return false;
          if (dangerFilter !== 'ALL' && s.danger !== dangerFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const hitName = s.name.toLowerCase().includes(q) || s.japaneseName.toLowerCase().includes(q);
            const hitTrait = s.traits.some(t => t.toLowerCase().includes(q));
            const hitTip = s.tips.some(t => t.toLowerCase().includes(q));
            if (!hitName && !hitTrait && !hitTip) return false;
          }
          return true;
        });
      }, [classFilter, dangerFilter, searchQuery]);

      return (
        <div className="space-y-5">
          {/* コントロールバー */}
          <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 shadow-xl flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4">
            <div className="flex flex-wrap items-center gap-2">
              <div className="flex bg-black p-1 rounded-xl border border-zinc-800">
                <button
                  onClick={() => setViewMode('matrix')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                    viewMode === 'matrix' ? 'bg-red-500 text-black shadow-md' : 'text-zinc-400 hover:text-white'
                  }`}
                >
                  早見表 (マトリクス)
                </button>
                <button
                  onClick={() => setViewMode('grid')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                    viewMode === 'grid' ? 'bg-red-500 text-black shadow-md' : 'text-zinc-400 hover:text-white'
                  }`}
                >
                  カード一覧
                </button>
              </div>

              {/* 分類フィルター */}
              <select
                value={classFilter}
                onChange={(e) => setClassFilter(e.target.value)}
                className="bg-black border border-zinc-800 text-xs text-zinc-200 rounded-xl px-3 py-2 font-mono focus:outline-none focus:border-red-500"
              >
                <option value="ALL">全分類 (Class: ALL)</option>
                <option value="CRYPTID">CRYPTID (未確認生物)</option>
                <option value="DEMON">DEMON (悪魔)</option>
                <option value="UMBRA">UMBRA (影/超常)</option>
                <option value="N/A">N/A (特殊)</option>
              </select>

              {/* 危険度フィルター */}
              <select
                value={dangerFilter}
                onChange={(e) => setDangerFilter(e.target.value)}
                className="bg-black border border-zinc-800 text-xs text-zinc-200 rounded-xl px-3 py-2 font-mono focus:outline-none focus:border-red-500"
              >
                <option value="ALL">全危険度 (Danger: ALL)</option>
                <option value="MODERATE">MODERATE (中)</option>
                <option value="CONSIDERABLE">CONSIDERABLE (高)</option>
                <option value="DEVASTATING">DEVASTATING (壊滅的)</option>
                <option value="UNKNOWN">UNKNOWN (未知)</option>
              </select>
            </div>

            {/* 検索バー */}
            <div className="relative">
              <input
                type="text"
                placeholder="スラッシャー名・特徴・対策で検索..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full md:w-64 bg-black border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-red-500 font-mono"
              />
              {searchQuery && (
                <button
                  onClick={() => setSearchQuery('')}
                  className="absolute right-2.5 top-2 text-zinc-500 hover:text-white text-xs"
                >
                  ×
                </button>
              )}
            </div>
          </div>

          {/* メインエリア: 左側一覧 ＆ 右側詳細 */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
            {/* 左側: 早見表マトリクス または グリッド */}
            <div className="lg:col-span-7 space-y-4">
              {viewMode === 'matrix' ? (
                /* === 早見表マトリクス表 (画像・分類・難易度) === */
                <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 shadow-2xl space-y-3">
                  <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <div>
                      <h2 className="text-sm font-black text-white uppercase tracking-wider flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                        Slasher Classification Matrix (分類 × 危険度 早見表)
                      </h2>
                      <p className="text-[11px] text-zinc-400 mt-0.5">
                        アイコンをクリックすると右側にパラメータ・特性・攻略が表示されます
                      </p>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full border-collapse text-left">
                      <thead>
                        <tr className="border-b border-zinc-800 text-[11px] font-mono">
                          <th className="p-2 text-zinc-500 w-24">分類 / 危険度</th>
                          {SLASHER_DANGERS.map(d => (
                            <th key={d.id} className="p-2 text-center">
                              <span className={`px-2 py-0.5 rounded font-black text-[10px] tracking-wider border ${d.color}`}>
                                {d.label}
                              </span>
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-800/60">
                        {SLASHER_CLASSES.map(cls => {
                          return (
                            <tr key={cls.id} className="hover:bg-zinc-800/20 transition">
                              {/* 縦軸ラベル: 分類 */}
                              <td className="p-2 align-middle">
                                <div className="space-y-0.5">
                                  <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-black border tracking-wider ${cls.color}`}>
                                    {cls.label}
                                  </span>
                                  <div className="text-[10px] text-zinc-400 font-bold">{cls.ja}</div>
                                  <div className="text-[9px] text-zinc-500 leading-tight hidden sm:block">{cls.desc}</div>
                                </div>
                              </td>

                              {/* 横軸4セル: 各危険度のスラッシャー達 */}
                              {SLASHER_DANGERS.map(d => {
                                const matched = SLASHERS_DATA.filter(s => s.class === cls.id && s.danger === d.id);

                                const renderSlasherBtn = (slasher) => {
                                  const isSelected = selectedSlasherId === slasher.id;
                                  const speed = getSpeedInfo(slasher);
                                  return (
                                    <button
                                      key={slasher.id}
                                      onClick={() => setSelectedSlasherId(slasher.id)}
                                      className={`group flex flex-col items-center p-1 rounded-xl border transition-all duration-150 relative ${
                                        isSelected
                                          ? 'border-red-500 bg-red-950/60 shadow-[0_0_15px_rgba(239,68,68,0.5)] ring-2 ring-red-500 scale-105 z-10'
                                          : 'border-zinc-800 bg-black/80 hover:border-zinc-500 hover:bg-zinc-800/60'
                                      }`}
                                      title={`${slasher.name} (${slasher.japaneseName}) - 追跡速度: ${slasher.stats?.chaseSpeed || '特殊'}`}
                                    >
                                      <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-lg overflow-hidden bg-black flex items-center justify-center border border-zinc-700/60 group-hover:border-white transition">
                                        <SlasherAvatar slasher={slasher} className="w-full h-full object-cover" />
                                      </div>
                                      <span className={`text-[9px] sm:text-[10px] font-mono font-bold mt-0.5 max-w-[52px] sm:max-w-[58px] truncate text-center transition ${
                                        isSelected ? 'text-red-400' : 'text-zinc-300 group-hover:text-white'
                                      }`}>
                                        {slasher.name}
                                      </span>
                                      {isSelected && (
                                        <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]"></span>
                                      )}
                                    </button>
                                  );
                                };

                                return (
                                  <td key={d.id} className="p-2 align-middle text-center">
                                    {matched.length === 0 ? (
                                      <span className="text-zinc-700 text-xs font-mono">-</span>
                                    ) : matched.length === 3 ? (
                                      /* 3体の場合: 上に1つ、下に2つのピラミッド配置 */
                                      <div className="grid grid-cols-2 gap-1.5 justify-items-center w-fit mx-auto">
                                        <div className="col-span-2 flex justify-center">
                                          {renderSlasherBtn(matched[0])}
                                        </div>
                                        <div className="flex justify-center">
                                          {renderSlasherBtn(matched[1])}
                                        </div>
                                        <div className="flex justify-center">
                                          {renderSlasherBtn(matched[2])}
                                        </div>
                                      </div>
                                    ) : matched.length === 4 ? (
                                      /* 4体の場合: 2x2のグリッド配置 */
                                      <div className="grid grid-cols-2 gap-1.5 justify-items-center w-fit mx-auto">
                                        {matched.map(slasher => (
                                          <div key={slasher.id} className="flex justify-center">
                                            {renderSlasherBtn(slasher)}
                                          </div>
                                        ))}
                                      </div>
                                    ) : (
                                      /* 1体または2体の場合: 中央揃え */
                                      <div className="flex flex-wrap gap-1.5 justify-center items-center w-fit mx-auto">
                                        {matched.map(slasher => renderSlasherBtn(slasher))}
                                      </div>
                                    )}
                                  </td>
                                );
                              })}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              ) : (
                /* === カードグリッド一覧表示 === */
                <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 shadow-2xl space-y-3">
                  <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <span className="text-xs font-mono text-zinc-400">
                      検索該当: <span className="text-white font-bold">{filteredSlashers.length}</span> 体
                    </span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {filteredSlashers.map(slasher => {
                      const isSelected = selectedSlasherId === slasher.id;
                      const dangerBadge = SLASHER_DANGERS.find(d => d.id === slasher.danger);

                      return (
                        <button
                          key={slasher.id}
                          onClick={() => setSelectedSlasherId(slasher.id)}
                          className={`flex items-center gap-3 p-2.5 rounded-xl border text-left transition-all ${
                            isSelected
                              ? 'border-red-500 bg-red-950/50 ring-2 ring-red-500 shadow-lg'
                              : 'border-zinc-800 bg-black hover:border-zinc-600 hover:bg-zinc-900/80'
                          }`}
                        >
                          <div className="w-12 h-12 rounded-lg overflow-hidden shrink-0 bg-black border border-zinc-700">
                            <SlasherAvatar slasher={slasher} className="w-full h-full object-cover" />
                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="text-xs font-black text-white truncate font-mono">{slasher.name}</div>
                            <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                              <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border ${dangerBadge?.color}`}>
                                {slasher.danger}
                              </span>
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            {/* 右側: 選択中スラッシャーの詳細データベース */}
            <div className="lg:col-span-5 space-y-4">
              <div className="bg-black border-2 border-zinc-800 rounded-2xl p-5 sm:p-6 shadow-2xl space-y-5 sticky top-5">
                
                {/* 看板ヘッダー */}
                <div className="flex flex-col sm:flex-row items-center sm:items-start gap-4 border-b border-zinc-800 pb-4">
                  <div className="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl overflow-hidden bg-black border-2 border-zinc-600 shrink-0 shadow-2xl relative">
                    <SlasherAvatar slasher={selectedSlasher} className="w-full h-full object-cover" />
                    <span className="absolute bottom-1 right-1 text-[9px] font-mono font-black px-1.5 py-0.5 rounded bg-black/80 text-zinc-300 border border-zinc-700">
                      {selectedSlasher.class}
                    </span>
                  </div>

                  <div className="text-center sm:text-left space-y-1.5 flex-1">
                    <div className="flex flex-wrap items-center justify-center sm:justify-start gap-1.5">
                      <span className={`text-[10px] font-black font-mono px-2 py-0.5 rounded border ${
                        SLASHER_CLASSES.find(c => c.id === selectedSlasher.class)?.color
                      }`}>
                        CLASS: {selectedSlasher.class}
                      </span>
                      <span className={`text-[10px] font-black font-mono px-2 py-0.5 rounded border ${
                        SLASHER_DANGERS.find(d => d.id === selectedSlasher.danger)?.color
                      }`}>
                        DANGER: {selectedSlasher.danger}
                      </span>
                    </div>

                    <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight font-mono">
                      {selectedSlasher.name}
                    </h2>
                    <div className="text-xs text-zinc-400 font-bold">
                      和名: {selectedSlasher.japaneseName}
                    </div>

                    <div className="pt-1 text-[11px] font-mono text-zinc-400 space-y-0.5">
                      <div><span className="text-zinc-500">攻撃タイプ:</span> <span className="text-red-400 font-bold">{selectedSlasher.attackType}</span></div>
                      <div className="leading-tight"><span className="text-zinc-500">接近予兆:</span> <span className="text-yellow-400/90">{selectedSlasher.proximityClue}</span></div>
                    </div>
                  </div>
                </div>

                {/* 移動速度 ブロック */}
                <SpeedAnalysisBlock slasher={selectedSlasher} />

                {/* 17大ステータス パラメータ一覧 */}
                <div className="space-y-2.5">
                  <div className="text-xs font-mono font-bold text-zinc-400 uppercase tracking-wider flex items-center gap-1.5 border-b border-zinc-800 pb-1">
                    スラッシャー感知・環境パラメータ
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                    {/* 知能 */}
                    <div className="bg-zinc-900/80 p-2 rounded-xl border border-zinc-800">
                      <div className="flex justify-between text-zinc-400 text-[11px]">
                        <span>知能 (Intelligence)</span>
                        <span className="text-white font-bold">{selectedSlasher.stats.intelligence}</span>
                      </div>
                      <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-1.5">
                        <div className="bg-blue-500 h-full rounded-full" style={{ width: `${Math.min(100, Number(selectedSlasher.stats.intelligence) || 0)}%` }}></div>
                      </div>
                      <span className="text-[9px] text-zinc-500">※瓶陽動・ロッカー看破力</span>
                    </div>

                    {/* 聴力 */}
                    <div className="bg-zinc-900/80 p-2 rounded-xl border border-zinc-800">
                      <div className="flex justify-between text-zinc-400 text-[11px]">
                        <span>聴力 (Hearing)</span>
                        <span className="text-white font-bold">{selectedSlasher.stats.hearing}</span>
                      </div>
                      <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-1.5">
                        <div className="bg-green-500 h-full rounded-full" style={{ width: `${Math.min(100, (Number(selectedSlasher.stats.hearing) || 0) / 2)}%` }}></div>
                      </div>
                      <span className="text-[9px] text-zinc-500">※足音・物音感知距離</span>
                    </div>

                    {/* 視力 */}
                    <div className="bg-zinc-900/80 p-2 rounded-xl border border-zinc-800">
                      <div className="flex justify-between text-zinc-400 text-[11px]">
                        <span>視力 (Eyesight)</span>
                        <span className="text-white font-bold">{selectedSlasher.stats.eyesight}</span>
                      </div>
                      <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-1.5">
                        <div className="bg-amber-500 h-full rounded-full" style={{ width: `${Math.min(100, (Number(selectedSlasher.stats.eyesight) || 0) / 2)}%` }}></div>
                      </div>
                      <span className="text-[9px] text-zinc-500">※遠視・視界深度</span>
                    </div>

                    {/* 直感 */}
                    <div className="bg-zinc-900/80 p-2 rounded-xl border border-zinc-800">
                      <div className="flex justify-between text-zinc-400 text-[11px]">
                        <span>直感 (Intuition)</span>
                        <span className="text-white font-bold">{selectedSlasher.stats.intuition}</span>
                      </div>
                      <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-1.5">
                        <div className="bg-purple-500 h-full rounded-full" style={{ width: `${Math.min(100, Number(selectedSlasher.stats.intuition) || 0)}%` }}></div>
                      </div>
                      <span className="text-[9px] text-zinc-500">※生存者座標特定確率</span>
                    </div>
                  </div>

                  {/* その他感知・怒り倍率詳細テーブル */}
                  <div className="bg-zinc-900/90 rounded-xl p-2.5 border border-zinc-800 text-[11px] font-mono space-y-1.5">
                    <div className="grid grid-cols-2 gap-x-3 gap-y-1.5">
                      <div><span className="text-zinc-500">視野角 (FOV):</span> <span className="text-zinc-200 font-bold">{selectedSlasher.stats.fov}°</span></div>
                      <div><span className="text-zinc-500">スタン耐性:</span> <span className="text-green-400 font-bold">{selectedSlasher.stats.stunDuration}</span></div>
                      <div><span className="text-zinc-500">怒り蓄積 (常時):</span> <span className="text-zinc-300 font-bold">{selectedSlasher.stats.angerPassive}</span></div>
                      <div><span className="text-zinc-500">怒り蓄積 (チェイス):</span> <span className="text-amber-400 font-bold">{selectedSlasher.stats.angerChase}</span></div>
                    </div>
                  </div>
                </div>

                {/* 特性・行動パターン */}
                <div className="space-y-2">
                  <div className="text-xs font-mono font-bold text-green-400 uppercase tracking-wider flex items-center gap-1.5 border-b border-zinc-800 pb-1">
                    特性・行動パターン
                  </div>
                  <ul className="space-y-1.5 text-xs text-zinc-300">
                    {selectedSlasher.traits.map((trait, idx) => (
                      <li key={idx} className="flex items-start gap-1.5 leading-relaxed bg-zinc-900/60 p-2 rounded-lg border border-zinc-800/80">
                        <span className="text-green-500 font-bold shrink-0">▸</span>
                        <span>{trait}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                {/* 攻略法・対策 */}
                <div className="space-y-2">
                  <div className="text-xs font-mono font-bold text-red-400 uppercase tracking-wider flex items-center gap-1.5 border-b border-zinc-800 pb-1">
                    攻略法・サバイバル対策
                  </div>
                  <ul className="space-y-1.5 text-xs text-zinc-300">
                    {selectedSlasher.tips.map((tip, idx) => (
                      <li key={idx} className="flex items-start gap-1.5 leading-relaxed bg-zinc-900/60 p-2 rounded-lg border border-red-950/40">
                        <span className="text-red-400 font-bold shrink-0">✓</span>
                        <span>{tip}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                {/* 相性の良いおすすめパーク */}
                {selectedSlasher.recommendedPerks && selectedSlasher.recommendedPerks.length > 0 && (
                  <div className="pt-2 border-t border-zinc-800 space-y-1.5">
                    <div className="text-[11px] font-mono text-zinc-400 flex items-center gap-1">
                      対策おすすめパーク:
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                      {selectedSlasher.recommendedPerks.map((perkName, idx) => (
                        <span
                          key={idx}
                          className="px-2 py-0.5 rounded-lg bg-green-950/60 border border-green-500/40 text-[11px] font-mono font-bold text-green-400 shadow-sm"
                        >
                          {perkName}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            </div>
          </div>
        </div>
      );
    }

    // アイコン画像コンポーネント (ローカル優先、失敗時CDN自動フォールバック、prop更新検知)
    function PerkIcon({ perk, className = "w-full h-full object-contain" }) {
      const [src, setSrc] = useState(perk?.icon || perk?.cdnIcon);

      React.useEffect(() => {
        setSrc(perk?.icon || perk?.cdnIcon);
      }, [perk?.id, perk?.icon, perk?.cdnIcon]);

      if (!perk) return null;

      return (
        <img
          src={src}
          alt={perk.name}
          onError={() => {
            if (perk.cdnIcon && src !== perk.cdnIcon) {
              setSrc(perk.cdnIcon);
            }
          }}
          className={className}
          loading="lazy"
        />
      );
    }
