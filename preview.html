    // 3大分類タブ (「すべて」は排除し、通常/パトロン/コラボの3択)
    const ITEM_GROUPS = [
      { id: 'DEFAULT', label: '通常アイテム' },
      { id: 'PATRON', label: 'パトロン' },
      { id: 'COLLAB', label: 'コラボ' },
    ];

    // アイテムアバター画像 (ローカル優先 ＆ CDNフォールバック付き)
    function ItemIcon({ item, className = "w-full h-full object-contain" }) {
      const [src, setSrc] = useState(item?.icon || item?.cdnIcon);
      const [failed, setFailed] = useState(false);

      React.useEffect(() => {
        setSrc(item?.icon || item?.cdnIcon);
        setFailed(false);
      }, [item?.id, item?.icon, item?.cdnIcon]);

      if (!item) return null;

      const handleError = () => {
        if (item.cdnIcon && src !== item.cdnIcon) {
          setSrc(item.cdnIcon);
        } else {
          setFailed(true);
        }
      };

      if (failed || !src) {
        return (
          <div className="w-full h-full rounded-lg bg-zinc-900 border border-zinc-700 flex flex-col items-center justify-center p-0.5 text-center font-mono text-zinc-400">
            
            <span className="text-[7px] font-bold truncate max-w-full">{item.name.slice(0, 4)}</span>
          </div>
        );
      }

      return (
        <img
          src={src}
          alt={item.japaneseName || item.name}
          onError={handleError}
          className={className}
          loading="lazy"
        />
      );
    }

    // =========================================================================
    // パーク ＆ アイテム 総合シミュレーター
    // =========================================================================
    function PerkSimulatorView() {
      // 装備中パークID一覧 (初期状態: 未選択 [])
      const [equippedPerkIds, setEquippedPerkIds] = useState([]);
      // 装備中アイテムID (手持ちスロット: 最大1個, 初期状態: null)
      const [equippedItemId, setEquippedItemId] = useState(null);

      // 詳細プレビュー選択 (パーク または アイテム)
      const [previewPerkId, setPreviewPerkId] = useState(null);
      const [previewItemId, setPreviewItemId] = useState(null);

      // 左側サブタブ: 'perks' (パークツリー) | 'items' (アイテム一覧)
      const [activeSubTab, setActiveSubTab] = useState('perks');

      // アイテム分類フィルター ('DEFAULT' | 'PATRON' | 'COLLAB') 初期値: 通常アイテム
      const [selectedItemGroup, setSelectedItemGroup] = useState('DEFAULT');
      const [itemSearchQuery, setItemSearchQuery] = useState('');

      const [ppAlertMessage, setPpAlertMessage] = useState(null);
      const [isCopied, setIsCopied] = useState(false);

      const maxPP = 15;

      // プレビュー中パーク
      const previewPerk = useMemo(() => {
        if (!previewPerkId) return null;
        return PERKS_DATA.find(p => p.id === previewPerkId) || null;
      }, [previewPerkId]);

      // プレビュー中アイテム
      const previewItem = useMemo(() => {
        if (!previewItemId) return null;
        return ITEMS_DATA.find(it => it.id === previewItemId) || null;
      }, [previewItemId]);

      // 装備中パーク一覧
      const equippedPerkList = useMemo(() => {
        return equippedPerkIds.map(id => PERKS_DATA.find(p => p.id === id)).filter(Boolean);
      }, [equippedPerkIds]);

      // 装備中アイテム (1個)
      const equippedItem = useMemo(() => {
        if (!equippedItemId) return null;
        return ITEMS_DATA.find(it => it.id === equippedItemId) || null;
      }, [equippedItemId]);

      // 消費PP計算 (最大15PP)
      const totalPPCost = useMemo(() => {
        return equippedPerkList.reduce((acc, curr) => acc + curr.ppCost, 0);
      }, [equippedPerkList]);

      const remainingPP = maxPP - totalPPCost;

      // アイテム購入クレジット総額 (1スロット分)
      const totalItemCost = useMemo(() => {
        return equippedItem ? (equippedItem.cost || 0) : 0;
      }, [equippedItem]);

      // パークによるアイテム効果変化フラグ（グルトン、健全など）
      const isGluttonActive = useMemo(() => equippedPerkIds.includes('t4_glutton'), [equippedPerkIds]);
      const isHealthy1 = useMemo(() => equippedPerkIds.includes('t1_healthy1'), [equippedPerkIds]);
      const isHealthy2 = useMemo(() => equippedPerkIds.includes('t3_healthy2'), [equippedPerkIds]);
      const isSlug = useMemo(() => equippedPerkIds.includes('t1_slug'), [equippedPerkIds]);
      const isSpeedAddictActive = useMemo(() => equippedPerkIds.includes('t2_addict'), [equippedPerkIds]);
      const isBalkanWarriorActive = useMemo(() => equippedPerkIds.includes('t6_balkan'), [equippedPerkIds]);
      const isMerchantActive = useMemo(() => equippedPerkIds.includes('t3_merchant'), [equippedPerkIds]);
      const isBatterUpActive = useMemo(() => equippedPerkIds.includes('t4_batter'), [equippedPerkIds]);
      const isMcNallyActive = useMemo(() => equippedPerkIds.includes('t2_mcnally'), [equippedPerkIds]);
      const isDeitySwindlerActive = useMemo(() => equippedPerkIds.includes('t4_deity'), [equippedPerkIds]);
      const isLeadBellyActive = useMemo(() => equippedPerkIds.includes('t6_lead'), [equippedPerkIds]);
      const isZyzzActive = useMemo(() => equippedPerkIds.includes('t6_zyzz'), [equippedPerkIds]);
      const isMukbangActive = useMemo(() => equippedPerkIds.includes('t2_mukbang'), [equippedPerkIds]);

      // アイテムの計算後効果（持続時間延長・回復補正）を算出する関数
      const getItemCalculatedStats = (item) => {
        if (!item) return null;
        const dur = item.durationData;
        let displayDuration = dur ? dur.durationText : null;
        let isDurationBoosted = false;

        const isSpeedBuffItem = item.id === 'milk_jug' || item.id === 'ready_soda';
        if (dur && dur.isExtendable) {
          if (isGluttonActive && isSpeedAddictActive && isSpeedBuffItem) {
            // グルトン(2.0x) × スピード狂(0.75x) = 1.5倍持続
            displayDuration = `${Math.round(dur.durationSecMin * 1.5)}〜${Math.round(dur.durationSecMax * 1.5)}秒 (グルトン×スピード狂: 1.5倍持続)`;
            isDurationBoosted = true;
          } else if (isGluttonActive) {
            displayDuration = dur.extendedText; // e.g. "160〜240秒 (2倍持続)"
            isDurationBoosted = true;
          } else if (isSpeedAddictActive && isSpeedBuffItem) {
            // スピード狂: 速度バフ持続25%減少 (0.75x)
            displayDuration = `${Math.round(dur.durationSecMin * 0.75)}〜${Math.round(dur.durationSecMax * 0.75)}秒 (スピード狂: -25%)`;
          }
        }

        // 回復量の計算 (健全、グルトン等による補正)
        let baseHealVal = dur?.baseHeal || item.statBonus?.healthBonus || null;
        if (item.id === 'costco_frozen_pizza' && isHealthy1) {
          baseHealVal = 2; // 健康パークでピザ摂食可能 (HP 2回復)
        }
        let calculatedHeal = baseHealVal;
        let isHealModified = false;
        if (calculatedHeal) {
          let mult = 1.0;
          if (isGluttonActive) mult *= 0.5;
          if (isSlug) mult *= 0.5;
          if (isHealthy1) mult *= 1.5;
          if (isHealthy2) mult *= 1.5;
          if (mult !== 1.0) {
            calculatedHeal = +(calculatedHeal * mult).toFixed(1);
            isHealModified = true;
          }
        }

        return {
          displayDuration,
          isDurationBoosted,
          calculatedHeal,
          isHealModified
        };
      };

      // 装備中アイテムの計算後ステータス
      const equippedItemStats = useMemo(() => {
        return getItemCalculatedStats(equippedItem);
      }, [equippedItem, isGluttonActive, isHealthy1, isHealthy2, isSlug, isSpeedAddictActive]);

      // プレビュー中アイテムの計算後ステータス
      const previewItemStats = useMemo(() => {
        return getItemCalculatedStats(previewItem);
      }, [previewItem, isGluttonActive, isHealthy1, isHealthy2, isSlug, isSpeedAddictActive]);

      // 総合ビルドステータス計算 (パーク ＋ アイテム合算)
      const buildStats = useMemo(() => {
        let totalFuelSpeed = 0;
        let totalSprintSpeed = 0;
        let totalHealthBonus = 0;
        let totalDamageReduction = 0;
        const specialPassives = [];

        // 1. パーク効果
        equippedPerkList.forEach(perk => {
          if (perk.statBonus?.fuelSpeed) totalFuelSpeed += perk.statBonus.fuelSpeed;
          if (perk.statBonus?.sprintSpeed) {
            let sp = perk.statBonus.sprintSpeed;
            // スピード狂による軽い足取り(I & II)の減速ペナルティ無効化！
            if (isSpeedAddictActive && (perk.id === 't3_lightfoot' || perk.id === 't4_lightfoot2')) {
              sp = 0; // 減速無効化
            }
            totalSprintSpeed += sp;
          }
          if (perk.statBonus?.maxHealth) totalHealthBonus += perk.statBonus.maxHealth;
          if (perk.statBonus?.damageReduction) totalDamageReduction += perk.statBonus.damageReduction;
          if (perk.statBonus?.special) specialPassives.push({ source: perk.name, text: perk.statBonus.special });
        });

        // リード・ベリー (-50%被ダメ) と エクストリーム・バフ (+50%被ダメ) の相殺計算
        if (isLeadBellyActive && isZyzzActive) {
          totalDamageReduction = 0; // 軽減と増加が相殺
        } else if (isZyzzActive) {
          totalDamageReduction -= 50; // 被ダメ50%増加
        }

        // 2. アイテム効果 (1個)
        let hasShield = false;
        if (equippedItem) {
          const isBalkanItem = equippedItem.id === 'balkan_boost' || equippedItem.id === 'rascal_rage';
          if (equippedItem.statBonus?.fuelSpeed) {
            if (isBalkanItem && isBalkanWarriorActive) {
              // バルカン・ウォリアー効果: 注油速度ボーナス減少 (+300% → +150%)
              totalFuelSpeed += 150;
            } else {
              totalFuelSpeed += equippedItem.statBonus.fuelSpeed;
            }
          }
          if (equippedItem.statBonus?.sprintSpeed) {
            let itemSp = equippedItem.statBonus.sprintSpeed;
            // スピード狂による石ころ・シナモンの減速(-10%)無効化！
            const isRock = equippedItem.id === 'the_rock' || equippedItem.id === 'cinnamon_stick';
            if (isSpeedAddictActive && isRock) {
              itemSp = 0;
            }
            totalSprintSpeed += itemSp;
          }
          if (equippedItem.statBonus?.healthBonus) {
            const h = equippedItemStats?.calculatedHeal ?? equippedItem.statBonus.healthBonus;
            totalHealthBonus += h;
          }
          if (equippedItem.statBonus?.damageReduction) {
            if (equippedItem.statBonus.damageReduction === 100) hasShield = true;
            totalDamageReduction += equippedItem.statBonus.damageReduction;
          }
          if (equippedItem.statBonus?.special) specialPassives.push({ source: equippedItem.japaneseName, text: equippedItem.statBonus.special });
        }

        totalDamageReduction = Math.min(100, totalDamageReduction);

        // 実効移動速度計算 (サバイバー通常走行 4.0 m/s 基準)
        const effectiveSpeedVal = +(4.0 * (1 + totalSprintSpeed / 100)).toFixed(2);
        const effectiveSpeed = `${effectiveSpeedVal} m/s`;

        return {
          totalFuelSpeed,
          totalSprintSpeed,
          effectiveSpeed,
          totalHealthBonus,
          totalDamageReduction,
          hasShield,
          specialPassives
        };
      }, [equippedPerkList, equippedItem, equippedItemStats, isBalkanWarriorActive, isSpeedAddictActive, isLeadBellyActive, isZyzzActive]);

      // 発動中バフ一覧 (パーク ＋ アイテム ＋ シナジー)
      const activeBuffList = useMemo(() => {
        const perkBuffs = equippedPerkList.flatMap(p =>
          p.buffs.map(b => ({ type: 'perk', source: p.name, text: b }))
        );
        const itemBuffs = equippedItem
          ? equippedItem.buffs.map(b => ({ type: 'item', source: equippedItem.japaneseName, text: b }))
          : [];

        // グルトンによる時間延長バフの明示
        if (isGluttonActive && equippedItem?.durationData?.isExtendable) {
          itemBuffs.unshift({
            type: 'synergy',
            source: 'グルトン×アイテム',
            text: `「${equippedItem.japaneseName}」の持続時間が2倍（${equippedItemStats?.displayDuration}）に延長中！`
          });
        }

        // バルカン・ウォリアーによる後遺症無効化シナジー
        const isBalkanEquipped = equippedItem?.id === 'balkan_boost' || equippedItem?.id === 'rascal_rage';
        if (isBalkanWarriorActive && isBalkanEquipped) {
          itemBuffs.unshift({
            type: 'synergy',
            source: 'バルカン・ウォリアー×バルカン',
            text: `「${equippedItem.japaneseName}」の後遺症（瀕死・移動速度低下・HP1固定）を完全無効化！ (給油速度+150%)`
          });
        }

        // スピード狂による軽い足取り減速無効化シナジー
        const hasLightfoot = equippedPerkIds.includes('t3_lightfoot') || equippedPerkIds.includes('t4_lightfoot2');
        if (isSpeedAddictActive && hasLightfoot) {
          itemBuffs.unshift({
            type: 'synergy',
            source: 'スピード狂×軽い足取り',
            text: '軽い足取りによる移動速度低下（-5%〜-10%）を完全無効化中！'
          });
        }

        // スピード狂による石ころ減速無効化シナジー
        const isRockEquipped = equippedItem?.id === 'the_rock' || equippedItem?.id === 'cinnamon_stick';
        if (isSpeedAddictActive && isRockEquipped) {
          itemBuffs.unshift({
            type: 'synergy',
            source: 'スピード狂×石ころ',
            text: `「${equippedItem.japaneseName}」による移動速度低下（-10%）を完全無効化中！（足音完全消音のみ適用）`
          });
        }

        // バッター、出番だ × Px-EMC シナジー
        if (isBatterUpActive && equippedItem?.id === 'px_emc') {
          itemBuffs.unshift({
            type: 'synergy',
            source: 'バッター、出番だ×Px-EMC',
            text: 'Px-EMCの不発率を15%に低減 ＆ クールダウンを約150秒に短縮！'
          });
        }

        // マックナリー・ハンズ × マスターロック607
        if (isMcNallyActive && equippedItem?.id === 'master_lock_607') {
          itemBuffs.unshift({
            type: 'synergy',
            source: 'マックナリー・ハンズ×ロック',
            text: 'マスターロック607の破損率を10%に激減（耐久値2.67倍） ＆ 開錠時追加ボーナス！'
          });
        }

        // 健康 × コストコの冷凍ピザ
        if (isHealthy1 && equippedItem?.id === 'costco_frozen_pizza') {
          itemBuffs.unshift({
            type: 'synergy',
            source: '健康×冷凍ピザ',
            text: 'カチコチの冷凍ピザを摂食可能（HP 2回復）！'
          });
        }

        // リード・ベリー × エクストリーム・バフ
        if (isLeadBellyActive && isZyzzActive) {
          itemBuffs.unshift({
            type: 'synergy',
            source: 'リード・ベリー×エクストリーム',
            text: '被ダメ+50%と-50%が相殺！ 重荷減速軽減とデバフ持続半減を安全に両立！'
          });
        }

        // 大食いチャンピオン × 健康
        if (isMukbangActive && (isHealthy1 || isHealthy2)) {
          itemBuffs.unshift({
            type: 'synergy',
            source: '大食いチャンピオン×健康',
            text: '半径6m味方全員への回復量を健康パークで+50%〜+100%底上げ中！'
          });
        }

        return [...perkBuffs, ...itemBuffs];
      }, [equippedPerkList, equippedItem, isGluttonActive, isBalkanWarriorActive, isSpeedAddictActive, isBatterUpActive, isMcNallyActive, isHealthy1, isHealthy2, isLeadBellyActive, isZyzzActive, isMukbangActive, equippedItemStats]);

      // 発動中デバフ一覧 (パーク ＋ アイテム)
      const activeDebuffList = useMemo(() => {
        const isBalkanEquipped = equippedItem?.id === 'balkan_boost' || equippedItem?.id === 'rascal_rage';
        const perkDebuffs = equippedPerkList.flatMap(p =>
          p.debuffs.map(d => ({ type: 'perk', source: p.name, text: d }))
        );
        let itemDebuffs = equippedItem
          ? equippedItem.debuffs.map(d => ({ type: 'item', source: equippedItem.japaneseName, text: d }))
          : [];

        // バルカン・ウォリアー装備時はバルカンブーストの後遺症デバフを除外
        if (isBalkanWarriorActive && isBalkanEquipped) {
          itemDebuffs = itemDebuffs.filter(d => !d.text.includes('132秒後') && !d.text.includes('HP1固定') && !d.text.includes('アイテム'));
        }

        // スピード狂装備時は軽い足取りおよび石ころの減速デバフを除外
        let filteredPerkDebuffs = perkDebuffs;
        if (isSpeedAddictActive) {
          filteredPerkDebuffs = filteredPerkDebuffs.filter(d => 
            !(d.source.includes('軽い足取り') && (d.text.includes('移動速度') || d.text.includes('5%') || d.text.includes('10%')))
          );
          itemDebuffs = itemDebuffs.filter(d => 
            !((d.source.includes('石ころ') || d.source.includes('シナモン')) && d.text.includes('移動速度'))
          );
        }

        return [...filteredPerkDebuffs, ...itemDebuffs];
      }, [equippedPerkList, equippedItem, isBalkanWarriorActive, isSpeedAddictActive]);

      // アイテムフィルタリング (通常 / パトロン / コラボ の3大分類切替)
      const filteredItems = useMemo(() => {
        return ITEMS_DATA.filter(it => {
          if (it.group !== selectedItemGroup) return false;
          if (itemSearchQuery.trim()) {
            const q = itemSearchQuery.toLowerCase();
            const hitName = it.name.toLowerCase().includes(q) || (it.japaneseName && it.japaneseName.toLowerCase().includes(q));
            const hitSummary = it.summary && it.summary.toLowerCase().includes(q);
            if (!hitName && !hitSummary) return false;
          }
          return true;
        });
      }, [selectedItemGroup, itemSearchQuery]);

      // パークの装備/解除トグル
      const handleToggleEquipPerk = (perk) => {
        setPpAlertMessage(null);
        if (equippedPerkIds.includes(perk.id)) {
          setEquippedPerkIds(prev => prev.filter(id => id !== perk.id));
        } else {
          if (totalPPCost + perk.ppCost > maxPP) {
            setPpAlertMessage(`PP不足: 「${perk.name}」は ${perk.ppCost} PP 必要ですが、残り ${remainingPP} PP です。`);
            setTimeout(() => setPpAlertMessage(null), 3500);
            return;
          }
          setEquippedPerkIds(prev => [...prev, perk.id]);
        }
      };

      // アイテムの装備/解除トグル (手持ちスロット: 最大1個)
      const handleToggleEquipItem = (item) => {
        if (equippedItemId === item.id) {
          setEquippedItemId(null);
        } else {
          setEquippedItemId(item.id);
        }
      };

      // 構成リセット
      const handleResetBuild = () => {
        setEquippedPerkIds([]);
        setEquippedItemId(null);
        setPreviewPerkId(null);
        setPreviewItemId(null);
        setPpAlertMessage(null);
      };

      // クリップボード共有テキスト生成
      const handleCopy = () => {
        const text = `【SlashCO パーク＆アイテム総合ビルド】\n` +
          `パーク装備数: ${equippedPerkList.length}個 ｜ 消費PP: ${totalPPCost} / ${maxPP} PP (残り: ${remainingPP} PP)\n` +
          `手持ちアイテム: ${equippedItem ? `${equippedItem.japaneseName} (${equippedItem.name}) [${equippedItem.cost}C]` : 'なし'} ｜ アイテム費用: ${totalItemCost} Credits\n` +
          (equippedItemStats?.displayDuration ? `アイテム効果持続: ${equippedItemStats.displayDuration}\n` : '') +
          `--------------------------------\n` +
          `【装備中パーク】\n` +
          (equippedPerkList.length > 0 ? equippedPerkList.map(p => `・[TIER ${p.tier}] ${p.name} (${p.ppCost} PP)`).join('\n') : 'なし') +
          `\n--------------------------------\n` +
          `【手持ちアイテム】\n` +
          (equippedItem ? `・${equippedItem.japaneseName} (${equippedItem.name}) [${equippedItem.cost}C]` : 'なし') +
          `\n--------------------------------\n` +
          `給油速度ボーナス: +${buildStats.totalFuelSpeed}%\n` +
          `移動速度ボーナス: ${buildStats.totalSprintSpeed >= 0 ? '+' : ''}${buildStats.totalSprintSpeed}% (実効速度: ${buildStats.effectiveSpeed})\n` +
          `被ダメージ軽減: ${buildStats.hasShield ? '100% 完全ガード' : buildStats.totalDamageReduction + '%'}\n` +
          `追加HP補正 / 回復: +${buildStats.totalHealthBonus} HP\n` +
          `--------------------------------\n` +
          `【発動中バフ特性】\n` +
          (activeBuffList.length > 0 ? activeBuffList.map(b => `[+] [${b.type === 'perk' ? 'パーク' : b.type === 'synergy' ? 'シナジー' : 'アイテム'}] ${b.text} (${b.source})`).join('\n') : 'なし') +
          `\n【発動中デバフ特性】\n` +
          (activeDebuffList.length > 0 ? activeDebuffList.map(d => `[-] [${d.type === 'perk' ? 'パーク' : 'アイテム'}] ${d.text} (${d.source})`).join('\n') : 'なし (ペナルティなし)');

        navigator.clipboard.writeText(text).then(() => {
          setIsCopied(true);
          setTimeout(() => setIsCopied(false), 2000);
        });
      };

      return (
        <div className="space-y-5">
          {/* PP上限オーバーアラート */}
          {ppAlertMessage && (
            <div className="bg-red-950/90 border border-red-500/80 text-red-200 px-4 py-3 rounded-2xl flex items-center justify-between shadow-lg shadow-red-950/50">
              <div className="flex items-center gap-2 text-xs sm:text-sm font-bold font-mono">
                <span className="font-bold text-red-400 font-mono">[!]</span>
                <span>{ppAlertMessage}</span>
              </div>
              <button
                onClick={() => setPpAlertMessage(null)}
                className="text-red-400 hover:text-white text-xs px-2 py-1 rounded"
              >
                ×
              </button>
            </div>
          )}

          {/* 総合ステータス概要カード (パークPPは除外して5分割表示) */}
          <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-zinc-800 pb-3">
              <div>
                <span className="text-xs font-mono font-bold text-green-400 uppercase tracking-wider flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-green-500"></span>
                  総合タクティカル・ステータス (パーク ＆ アイテム合算)
                </span>
                <p className="text-[11px] text-zinc-400 mt-0.5">
                  装備パークと手持ちアイテムの効果がリアルタイムに統合計算されます
                </p>
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto">
                <button
                  onClick={handleResetBuild}
                  className="px-3 py-1.5 rounded-xl bg-zinc-950 border border-zinc-700 hover:border-red-500/60 hover:text-red-400 text-zinc-400 text-xs font-mono font-bold flex items-center gap-1 transition shadow-sm"
                  title="パークとアイテムをリセット"
                >
                  <span className="font-mono text-xs">↺</span>
                  <span>リセット</span>
                </button>
                <button
                  onClick={handleCopy}
                  className="w-full sm:w-auto px-3.5 py-1.5 rounded-xl bg-green-950/80 border border-green-500/60 hover:bg-green-900 text-green-300 text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition shadow-sm"
                >
                  <span className="font-mono text-xs">{isCopied ? '✓' : ''}</span>
                  <span>{isCopied ? 'コピー完了！' : 'ビルド構成をコピー'}</span>
                </button>
              </div>
            </div>

            {/* 5分割メトリクス (パークPPは除外) */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5 font-mono">
              {/* 給油速度 */}
              <div className="bg-black/90 p-3 rounded-xl border border-zinc-800 flex flex-col justify-between">
                <div className="text-[10px] text-zinc-400 flex items-center justify-between">
                  <span>給油速度</span>
                  <span className="text-[9px] text-zinc-500">合算</span>
                </div>
                <div className="text-lg font-black text-amber-400 mt-1">
                  +{buildStats.totalFuelSpeed}%
                </div>
                <div className="text-[9px] text-zinc-500 mt-0.5 truncate">発電機完了速度</div>
              </div>

              {/* 移動速度 */}
              <div className="bg-black/90 p-3 rounded-xl border border-zinc-800 flex flex-col justify-between">
                <div className="text-[10px] text-zinc-400 flex items-center justify-between">
                  <span>移動速度</span>
                  <span className="text-cyan-400 font-bold text-[9px]">{buildStats.effectiveSpeed}</span>
                </div>
                <div className="text-lg font-black text-cyan-400 mt-1">
                  {buildStats.totalSprintSpeed >= 0 ? '+' : ''}{buildStats.totalSprintSpeed}%
                </div>
                <div className="text-[9px] text-zinc-500 mt-0.5 truncate">基準: 4.0 m/s</div>
              </div>

              {/* 被ダメ軽減 / ガード */}
              <div className="bg-black/90 p-3 rounded-xl border border-zinc-800 flex flex-col justify-between">
                <div className="text-[10px] text-zinc-400 flex items-center justify-between">
                  <span>被ダメ軽減</span>
                  <span className="text-[9px] text-zinc-500">防御</span>
                </div>
                <div className={`text-lg font-black mt-1 ${buildStats.hasShield ? 'text-blue-400 text-sm' : 'text-blue-400'}`}>
                  {buildStats.hasShield ? '完全ガード' : `${buildStats.totalDamageReduction}%`}
                </div>
                <div className="text-[9px] text-zinc-500 mt-0.5 truncate">{buildStats.hasShield ? '非即死攻撃無効' : '耐久ダメージカット'}</div>
              </div>

              {/* HP補正 */}
              <div className="bg-black/90 p-3 rounded-xl border border-zinc-800 flex flex-col justify-between">
                <div className="text-[10px] text-zinc-400 flex items-center justify-between">
                  <span>HP補正/回復</span>
                  <span className="text-[9px] text-zinc-500">基礎10</span>
                </div>
                <div className="text-lg font-black text-emerald-400 mt-1">
                  +{buildStats.totalHealthBonus} HP
                </div>
                <div className="text-[9px] text-zinc-500 mt-0.5 truncate">最大HP/回復ポテンシャル</div>
              </div>

              {/* アイテム購入費 ＆ 持続時間 */}
              <div className="bg-black/90 p-3 rounded-xl border border-zinc-800 flex flex-col justify-between">
                <div className="text-[10px] text-zinc-400 flex items-center justify-between">
                  <span>アイテム費用</span>
                  <span className="text-[9px] text-zinc-500">1枠</span>
                </div>
                <div className="text-lg font-black text-yellow-400 mt-1">
                  {totalItemCost} <span className="text-xs text-zinc-500">C</span>
                </div>
                <div className="text-[9px] text-zinc-400 mt-0.5 truncate">
                  {equippedItemStats?.displayDuration ? `持続: ${equippedItemStats.displayDuration}` : (equippedItem ? '1個装備中' : '未装備')}
                </div>
              </div>
            </div>

            {/* 装備中アイテム ＆ 装備中パークのクイックバー */}
            <div className="grid grid-cols-1 md:grid-cols-12 gap-3 pt-2 border-t border-zinc-800/80">
              
              {/* 手持ちアイテムスロット (最大1個) */}
              <div className="md:col-span-5 bg-black/60 rounded-xl p-3 border border-zinc-800/80 space-y-2">
                <div className="flex justify-between items-center text-xs font-mono">
                  <span className="text-zinc-300 font-bold flex items-center gap-1.5">
                    手持ちアイテム (1スロット)
                  </span>
                  <span className="text-[10px] text-zinc-500">クリックで詳細プレビュー</span>
                </div>

                <div>
                  {equippedItem ? (
                    <div
                      onClick={() => {
                        setPreviewItemId(equippedItem.id);
                        setPreviewPerkId(null);
                      }}
                      className={`cursor-pointer p-2.5 rounded-xl border transition flex items-center justify-between gap-2.5 relative group ${
                        previewItemId === equippedItem.id
                          ? 'border-yellow-400 bg-yellow-950/40 ring-1 ring-yellow-400 shadow-md'
                          : 'border-emerald-500/60 bg-emerald-950/20 hover:border-emerald-400'
                      }`}
                    >
                      <div className="flex items-center gap-2.5 min-w-0">
                        <div className="w-10 h-10 rounded-lg overflow-hidden shrink-0 bg-black border border-zinc-700 flex items-center justify-center p-0.5">
                          <ItemIcon item={equippedItem} className="w-full h-full object-contain" />
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center gap-1.5">
                            <span className="text-xs font-bold text-white truncate font-mono">{equippedItem.japaneseName}</span>
                            <span className="text-[9px] text-zinc-400 font-mono">({equippedItem.name})</span>
                          </div>
                          <div className="flex items-center gap-2 mt-0.5 text-[10px] font-mono">
                            <span className="text-yellow-400 font-bold">{equippedItem.cost} Credits</span>
                            <span className="text-zinc-500 font-normal">[{equippedItem.groupJa}]</span>
                            {equippedItemStats?.displayDuration && (
                              <span className={`px-1 rounded ${equippedItemStats.isDurationBoosted ? 'bg-amber-950 text-amber-300 font-bold' : 'text-zinc-400'}`}>
                                {equippedItemStats.displayDuration}
                              </span>
                            )}
                          </div>
                        </div>
                      </div>

                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          handleToggleEquipItem(equippedItem);
                        }}
                        className="px-2.5 py-1 rounded-lg bg-red-950/80 hover:bg-red-900 border border-red-500/60 text-red-300 text-xs font-mono font-bold transition shrink-0 flex items-center gap-1"
                        title="手持ちから外す"
                      >
                        <span>×</span> 外す
                      </button>
                    </div>
                  ) : (
                    <button
                      onClick={() => setActiveSubTab('items')}
                      className="w-full p-2.5 rounded-xl border border-dashed border-zinc-700 hover:border-zinc-500 bg-zinc-950/60 hover:bg-zinc-900 text-zinc-500 hover:text-zinc-300 text-xs font-mono flex items-center justify-center gap-2 transition"
                    >
                      <span className="text-sm">+</span>
                      <span className="text-[11px]">手持ちアイテム未装備 (クリックして一覧から選択)</span>
                    </button>
                  )}
                </div>
              </div>

              {/* 装備中パークチップス */}
              <div className="md:col-span-7 bg-black/60 rounded-xl p-3 border border-zinc-800/80 space-y-2">
                <div className="flex justify-between items-center text-xs font-mono">
                  <span className="text-zinc-300 font-bold flex items-center gap-1.5">
                    装備中パーク ({equippedPerkList.length}個)
                  </span>
                  <span className="text-[10px] text-zinc-500">クリックで詳細プレビュー</span>
                </div>

                {equippedPerkList.length === 0 ? (
                  <div className="text-zinc-600 text-xs font-mono py-2 text-center">
                    パーク未装備です。下のツリーから選択してください。
                  </div>
                ) : (
                  <div className="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto pr-1">
                    {equippedPerkList.map(perk => {
                      const isPreview = previewPerkId === perk.id;
                      return (
                        <div
                          key={perk.id}
                          onClick={() => {
                            setPreviewPerkId(perk.id);
                            setPreviewItemId(null);
                          }}
                          className={`cursor-pointer flex items-center gap-1.5 pl-1.5 pr-1 py-1 rounded-lg border text-xs font-mono transition shadow-sm ${
                            isPreview
                              ? 'border-green-400 bg-green-950/60 ring-1 ring-green-400 text-white'
                              : 'border-green-500/50 hover:border-green-400 bg-zinc-900 hover:bg-zinc-800 text-zinc-200'
                          }`}
                          title={`${perk.name} の詳細を表示`}
                        >
                          <div className="w-5 h-5 rounded overflow-hidden shrink-0 bg-black flex items-center justify-center">
                            <PerkIcon perk={perk} className="w-full h-full object-contain p-0.5" />
                          </div>
                          <span className="text-xs font-semibold">{perk.name}</span>
                          <span className="text-[10px] text-green-400 font-bold">({perk.ppCost}PP)</span>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleToggleEquipPerk(perk);
                            }}
                            className="w-4 h-4 rounded flex items-center justify-center text-zinc-400 hover:text-red-400 hover:bg-red-950/60 transition ml-0.5"
                            title="装備から外す"
                          >
                            ×
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

            </div>

            {/* 発動中バフ＆デバフ一覧 */}
            {(activeBuffList.length > 0 || activeDebuffList.length > 0) && (
              <div className="pt-2 border-t border-zinc-800/80 grid grid-cols-1 md:grid-cols-2 gap-3">
                {/* バフ */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-mono font-bold text-green-400 flex items-center gap-1">
                    <span>発動中バフ特性 ({activeBuffList.length})</span>
                  </div>
                  <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-1">
                    {activeBuffList.map((b, i) => (
                      <span
                        key={i}
                        className={`text-[10px] font-mono px-2 py-0.5 rounded border shadow-sm ${
                          b.type === 'synergy'
                            ? 'bg-amber-950/70 border-amber-400/60 text-amber-200 font-bold shadow-amber-500/20'
                            : b.type === 'item'
                            ? 'bg-yellow-950/40 border-yellow-500/40 text-yellow-200'
                            : 'bg-green-950/40 border-green-500/40 text-green-200'
                        }`}
                        title={`提供: ${b.source}`}
                      >
                        <span className="opacity-75 font-bold mr-1">[{b.source}]</span>
                        {b.text}
                      </span>
                    ))}
                  </div>
                </div>

                {/* デバフ */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-mono font-bold text-red-400 flex items-center gap-1">
                    <span>発動中デバフ特性 ({activeDebuffList.length})</span>
                  </div>
                  <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-1">
                    {activeDebuffList.length === 0 ? (
                      <span className="text-[10px] font-mono text-zinc-500 py-0.5">ペナルティなし</span>
                    ) : (
                      activeDebuffList.map((d, i) => (
                        <span
                          key={i}
                          className="text-[10px] font-mono px-2 py-0.5 rounded border bg-red-950/40 border-red-500/40 text-red-200 shadow-sm"
                          title={`提供: ${d.source}`}
                        >
                          <span className="opacity-75 font-bold mr-1">[{d.source}]</span>
                          {d.text}
                        </span>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* メインセレクター: 左側一覧 (パーク / アイテム 切替) ＆ 右側詳細プレビュー */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
            
            {/* 左側カラム: パークツリー または アイテム一覧 */}
            <div className="lg:col-span-7 space-y-4">
              
              {/* サブタブ切替バー: [パーク一覧 (36種)] / [アイテム一覧 (39種)] */}
              <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-2.5 flex justify-between items-center gap-2 shadow-xl">
                <div className="flex bg-black p-1 rounded-xl border border-zinc-800">
                  <button
                    onClick={() => setActiveSubTab('perks')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-bold font-mono transition flex items-center gap-1.5 ${
                      activeSubTab === 'perks'
                        ? 'bg-green-500 text-black shadow-md font-black'
                        : 'text-zinc-400 hover:text-white'
                    }`}
                  >
                    パーク一覧 (全36種)
                  </button>
                  <button
                    onClick={() => setActiveSubTab('items')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-bold font-mono transition flex items-center gap-1.5 ${
                      activeSubTab === 'items'
                        ? 'bg-yellow-500 text-black shadow-md font-black'
                        : 'text-zinc-400 hover:text-white'
                    }`}
                  >
                    アイテム一覧 (全39種)
                  </button>
                </div>

                <span className="text-[11px] font-mono text-zinc-400 hidden sm:inline">
                  {activeSubTab === 'perks' ? '自由構成ツリー (15PP)' : '手持ち装備 (1スロット)'}
                </span>
              </div>

              {/* サブタブ 1: パークツリー (最上部にパークPP消費メーターを配置) */}
              {activeSubTab === 'perks' && (
                <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-2xl space-y-4">
                  
                  {/* パーク一覧上部に設置されたパークPP消費メーター */}
                  <div className="bg-black/90 rounded-xl p-3.5 border border-zinc-800 space-y-2">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-mono font-black text-green-400 flex items-center gap-1.5">
                          パークPP消費: {totalPPCost} / {maxPP} PP
                        </span>
                        <span className={`text-[11px] font-mono font-bold px-2 py-0.5 rounded-lg border ${
                          remainingPP === 0
                            ? 'bg-green-950/80 text-green-400 border-green-500/50'
                            : 'bg-zinc-800 text-zinc-300 border-zinc-700'
                        }`}>
                          残り {remainingPP} PP
                        </span>
                      </div>
                      <span className="text-[11px] text-zinc-400 font-mono">
                        装備中: {equippedPerkList.length} 個 (最大15 PP)
                      </span>
                    </div>

                    {/* PPプログレスバー */}
                    <div className="w-full bg-zinc-950 h-3 rounded-full overflow-hidden relative border border-zinc-800 p-0.5">
                      <div
                        className={`h-full rounded-full transition-all duration-300 ${
                          totalPPCost === maxPP
                            ? 'bg-gradient-to-r from-emerald-500 to-green-400 shadow-[0_0_10px_rgba(74,222,128,0.6)]'
                            : 'bg-gradient-to-r from-green-600 to-emerald-500'
                        }`}
                        style={{ width: `${(totalPPCost / maxPP) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <span className="text-xs font-mono font-bold text-zinc-400 uppercase tracking-wider">
                      TIER 1 〜 TIER 6 パークツリー
                    </span>
                    <span className="text-[11px] text-zinc-500 font-mono">
                      クリックで詳細 ｜ ダブルクリックで直接装備/解除
                    </span>
                  </div>

                  <div className="space-y-4">
                    {TIERS_META.map(t => {
                      const tierPerks = PERKS_DATA.filter(p => p.tier === t.tier);
                      const equippedInThisTier = equippedPerkList.filter(p => p.tier === t.tier);

                      return (
                        <div key={t.tier} className="bg-black/70 rounded-xl p-3 border border-zinc-800 space-y-2">
                          <div className="flex justify-between items-center text-xs font-mono">
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-white tracking-wide">
                                TIER {t.tier} ({t.cost} PP)
                              </span>
                              <span className="text-zinc-500 text-[10px]">
                                解放: Lvl {t.level}
                              </span>
                            </div>
                            {equippedInThisTier.length > 0 && (
                              <div className="flex items-center gap-1">
                                <span className="text-green-400 font-bold text-[10px]">
                                  {equippedInThisTier.length}個装備中
                                </span>
                              </div>
                            )}
                          </div>

                          <div className="grid grid-cols-6 gap-2">
                            {tierPerks.map(perk => {
                              const isEquipped = equippedPerkIds.includes(perk.id);
                              const isPreview = previewPerkId === perk.id;

                              return (
                                <button
                                  key={perk.id}
                                  onClick={() => {
                                    setPreviewPerkId(perk.id);
                                    setPreviewItemId(null);
                                  }}
                                  onDoubleClick={() => handleToggleEquipPerk(perk)}
                                  className={`aspect-square rounded-lg flex items-center justify-center p-1 transition-all duration-150 relative overflow-hidden ${
                                    isEquipped
                                      ? 'border-2 border-green-400 bg-green-950/40 shadow-[0_0_15px_rgba(74,222,128,0.5)] ring-1 ring-green-400'
                                      : isPreview
                                      ? 'border-2 border-white bg-zinc-800/80'
                                      : 'border-2 border-zinc-300/80 bg-black hover:border-white'
                                  }`}
                                  title={`${perk.name} (${perk.ppCost} PP) - クリックで詳細、ダブルクリックで装備`}
                                >
                                  <PerkIcon perk={perk} className="w-full h-full object-contain p-0.5" />
                                  {isEquipped && (
                                    <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]"></span>
                                  )}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* サブタブ 2: アイテム一覧シェルフ (通常 / パトロン / コラボ の3大分類切替) */}
              {activeSubTab === 'items' && (
                <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-2xl space-y-4">
                  {/* 分類タブ ＆ 検索バー */}
                  <div className="space-y-3 border-b border-zinc-800 pb-3">
                    {/* 通常 / パトロン / コラボ 切替タブ */}
                    <div className="flex flex-wrap gap-2">
                      {ITEM_GROUPS.map(grp => {
                        const count = ITEMS_DATA.filter(it => it.group === grp.id).length;
                        const isSelected = selectedItemGroup === grp.id;
                        return (
                          <button
                            key={grp.id}
                            onClick={() => setSelectedItemGroup(grp.id)}
                            className={`px-3.5 py-1.5 rounded-xl text-xs font-mono transition flex items-center gap-1.5 ${
                              isSelected
                                ? 'bg-yellow-500 text-black font-black shadow-md'
                                : 'bg-black text-zinc-400 hover:text-white border border-zinc-800'
                            }`}
                          >
                            <span>{grp.label}</span>
                            <span className="text-[10px] opacity-75">({count})</span>
                          </button>
                        );
                      })}
                    </div>

                    {/* 検索ボックス */}
                    <div className="relative">
                      <input
                        type="text"
                        placeholder="アイテム名（日本語・英語）で絞り込み..."
                        value={itemSearchQuery}
                        onChange={(e) => setItemSearchQuery(e.target.value)}
                        className="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-yellow-500 font-mono"
                      />
                      {itemSearchQuery && (
                        <button
                          onClick={() => setItemSearchQuery('')}
                          className="absolute right-2.5 top-2 text-zinc-500 hover:text-white text-xs"
                        >
                          ×
                        </button>
                      )}
                    </div>
                  </div>

                  {/* アイテムカード一覧グリッド (アイコン ＋ 名前のみ表示) */}
                  <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5 max-h-[600px] overflow-y-auto pr-1">
                    {filteredItems.map(item => {
                      const isEquipped = equippedItemId === item.id;
                      const isPreview = previewItemId === item.id;

                      return (
                        <button
                          key={item.id}
                          onClick={() => {
                            setPreviewItemId(item.id);
                            setPreviewPerkId(null);
                          }}
                          className={`group flex flex-col items-center justify-between p-2 rounded-xl border transition-all duration-150 relative text-center aspect-square ${
                            isPreview
                              ? 'border-yellow-400 bg-yellow-950/40 ring-2 ring-yellow-400/80 shadow-lg scale-105 z-10'
                              : isEquipped
                              ? 'border-emerald-500/80 bg-emerald-950/30 ring-1 ring-emerald-500/50 shadow-md'
                              : 'border-zinc-800 bg-black hover:border-zinc-500 hover:bg-zinc-900/90'
                          }`}
                          title={`${item.japaneseName} (${item.name}) - クリックで右側に詳細表示`}
                        >
                          {/* 装備中バッジ */}
                          {isEquipped && (
                            <span className="absolute top-1 right-1 px-1 py-0.2 rounded text-[8px] font-mono font-black bg-emerald-400 text-black shadow-sm">
                              装備中
                            </span>
                          )}
                          {/* 分類表示 */}

                          {/* アイテムアイコン */}
                          <div className="w-11 h-11 sm:w-13 sm:h-13 rounded-lg overflow-hidden flex items-center justify-center p-0.5 group-hover:scale-105 transition mt-1">
                            <ItemIcon item={item} className="w-full h-full object-contain" />
                          </div>

                          {/* 名前 (日本語名 ＆ 英語名) - 値段や効果は排除 */}
                          <div className="w-full mt-1">
                            <div className={`text-[11px] font-bold font-mono truncate ${
                              isPreview ? 'text-yellow-400' : isEquipped ? 'text-emerald-400' : 'text-zinc-200 group-hover:text-white'
                            }`}>
                              {item.japaneseName}
                            </div>
                            <div className="text-[9px] text-zinc-500 font-mono truncate">
                              {item.name}
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>

            {/* 右側カラム: 詳細プレビュー看板カード (パーク または アイテム) */}
            <div className="lg:col-span-5 space-y-4">
              
              {/* パーク詳細プレビュー */}
              {previewPerk && (
                <div key={previewPerk.id} className="bg-black border-2 border-zinc-700 rounded-2xl p-6 shadow-2xl text-center space-y-4 sticky top-5">
                  <div className="mx-auto w-48 h-48 sm:w-56 sm:h-56 bg-black border-4 border-zinc-200 rounded-xl p-4 flex items-center justify-center relative shadow-inner">
                    <PerkIcon perk={previewPerk} className="w-full h-full object-contain p-2" />
                    <span className="absolute top-2 right-2 text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-zinc-800 border border-zinc-600 text-zinc-300">
                      TIER {previewPerk.tier}
                    </span>
                  </div>

                  <div>
                    <h3 className="text-xl sm:text-2xl font-black text-white font-mono tracking-wide">
                      [{previewPerk.name}]
                    </h3>
                    <div className="text-sm font-bold text-white mt-0.5 tracking-widest font-mono">
                      {previewPerk.ppCost} PP
                    </div>
                  </div>

                  <p className="text-xs text-zinc-400 italic px-4 border-t border-b border-zinc-800 py-2">
                    {previewPerk.flavor}
                  </p>

                  <div className="text-left space-y-2 font-mono text-xs">
                    {previewPerk.buffs.length > 0 && (
                      <div className="space-y-1">
                        <span className="text-[11px] font-bold text-green-400">効果・バフ特性:</span>
                        <ul className="space-y-1 text-green-300/90 pl-1">
                          {previewPerk.buffs.map((buff, i) => (
                            <li key={i} className="flex items-start gap-1">
                              <span className="text-green-500 font-bold shrink-0">[+]</span>
                              <span>{buff}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {previewPerk.debuffs.length > 0 && (
                      <div className="space-y-1 pt-1">
                        <span className="text-[11px] font-bold text-red-400">ペナルティ・デバフ:</span>
                        <ul className="space-y-1 text-red-300/90 pl-1">
                          {previewPerk.debuffs.map((deb, i) => (
                            <li key={i} className="flex items-start gap-1">
                              <span className="text-red-500 font-bold shrink-0">[-]</span>
                              <span>{deb}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>

                  <div className="pt-2">
                    {equippedPerkIds.includes(previewPerk.id) ? (
                      <button
                        onClick={() => handleToggleEquipPerk(previewPerk)}
                        className="w-full py-2.5 rounded-xl bg-red-950 border border-red-500/80 hover:bg-red-900 text-red-300 font-bold font-mono text-xs sm:text-sm transition shadow-lg"
                      >
                        構成から外す (PP解放)
                      </button>
                    ) : (
                      <button
                        onClick={() => handleToggleEquipPerk(previewPerk)}
                        className="w-full py-2.5 rounded-xl bg-green-500 hover:bg-green-400 text-black font-black font-mono text-xs sm:text-sm transition shadow-lg shadow-green-500/20"
                      >
                        構成に装備する ({previewPerk.ppCost} PP)
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* アイテム詳細プレビュー (持続時間計算・グルトン連携・全詳細展開) */}
              {previewItem && (
                <div key={previewItem.id} className="bg-black border-2 border-yellow-500/50 rounded-2xl p-6 shadow-2xl space-y-4 sticky top-5">
                  <div className="mx-auto w-44 h-44 sm:w-52 sm:h-52 bg-zinc-950 border-4 border-yellow-500/60 rounded-xl p-4 flex items-center justify-center relative shadow-inner">
                    <ItemIcon item={previewItem} className="w-full h-full object-contain p-2" />
                    <span className="absolute top-2 right-2 text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-yellow-950 border border-yellow-500 text-yellow-300">
                      {previewItem.groupJa}
                    </span>
                  </div>

                  <div className="text-center">
                    <h3 className="text-xl sm:text-2xl font-black text-white font-mono tracking-wide">
                      {previewItem.japaneseName}
                    </h3>
                    <div className="text-xs text-zinc-400 font-mono mt-0.5">
                      {previewItem.name}
                    </div>
                    <div className="flex justify-center items-center gap-3 mt-1.5 text-xs font-mono">
                      <span className="text-yellow-400 font-bold bg-yellow-950/60 px-2 py-0.5 rounded border border-yellow-500/40">
                        購入: {previewItem.cost} Credits
                      </span>
                      <span className={`px-2 py-0.5 rounded border font-bold ${isMerchantActive ? 'text-amber-300 bg-amber-950/60 border-amber-500/50' : 'text-zinc-400 bg-zinc-900 border-zinc-700'}`}>
                        売却: {isMerchantActive ? Math.round(previewItem.cost * 0.5) : previewItem.sellPrice} C {isMerchantActive ? '(商人: 50%)' : ''}
                      </span>
                    </div>
                  </div>

                  {/* パーク連動: 効果持続時間 ＆ 回復量計算表示 */}
                  {(previewItemStats?.displayDuration || previewItemStats?.calculatedHeal) && (
                    <div className="bg-zinc-950 p-2.5 rounded-xl border border-zinc-800 space-y-1.5 text-left">
                      {previewItemStats.displayDuration && (
                        <div>
                          <div className="flex justify-between items-center text-xs font-mono">
                            <span className="text-zinc-400 flex items-center gap-1">
                              効果持続時間:
                            </span>
                            <span className={`font-bold ${previewItemStats.isDurationBoosted ? 'text-amber-400 font-black' : 'text-zinc-200'}`}>
                              {previewItemStats.displayDuration}
                            </span>
                          </div>
                          {previewItemStats.isDurationBoosted ? (
                            <div className="text-[10px] font-mono text-amber-300 bg-amber-950/40 p-1.5 rounded border border-amber-500/40 mt-1 flex items-center gap-1">
                              <span>【グルトン適用中】効果減衰が50%遅延し、持続時間が2倍（100%延長）に強化中！</span>
                            </div>
                          ) : previewItem.durationData?.isExtendable ? (
                            <div className="text-[10px] font-mono text-zinc-500 mt-0.5">
                              ※ パーク「グルトン」装備で持続時間が2倍（{previewItem.durationData.extendedText}）に延長可能
                            </div>
                          ) : null}
                          {(previewItem.id === 'balkan_boost' || previewItem.id === 'rascal_rage') && isBalkanWarriorActive && (
                            <div className="text-[10px] font-mono text-emerald-300 bg-emerald-950/40 p-1.5 rounded border border-emerald-500/40 mt-1">
                              【バルカン・ウォリアー適用中】使用後の瀕死・移動速度低下デバフを完全無効化！ (給油ボーナス: +150%)
                            </div>
                          )}
                          {(previewItem.id === 'the_rock' || previewItem.id === 'cinnamon_stick') && isSpeedAddictActive && (
                            <div className="text-[10px] font-mono text-cyan-300 bg-cyan-950/40 p-1.5 rounded border border-cyan-500/40 mt-1">
                              【スピード狂 適用中】移動速度-10%の減速デバフを完全無効化！（足音完全消音のみ享受）
                            </div>
                          )}
                          {previewItem.id === 'px_emc' && isBatterUpActive && (
                            <div className="text-[10px] font-mono text-emerald-300 bg-emerald-950/40 p-1.5 rounded border border-emerald-500/40 mt-1">
                              【バッター、出番だ適用中】不発（ジャム）率 25% → 15% に低下！ クールダウン 200秒 → 約150秒 に短縮！
                            </div>
                          )}
                          {previewItem.id === 'master_lock_607' && isMcNallyActive && (
                            <div className="text-[10px] font-mono text-emerald-300 bg-emerald-950/40 p-1.5 rounded border border-emerald-500/40 mt-1">
                              【マックナリー・ハンズ適用中】耐久度約2.67倍（破損率25%→10%） ＆ 開錠成功時ボーナス獲得！
                            </div>
                          )}
                          {previewItem.id === 'costco_frozen_pizza' && isHealthy1 && (
                            <div className="text-[10px] font-mono text-emerald-300 bg-emerald-950/40 p-1.5 rounded border border-emerald-500/40 mt-1">
                              【健康 適用中】頑丈な胃袋により「HP 2 回復」アイテムとして摂食可能！
                            </div>
                          )}
                          {(previewItem.id === 'deathward' || previewItem.id === 'reverse_card') && isDeitySwindlerActive && (
                            <div className="text-[10px] font-mono text-amber-300 bg-amber-950/40 p-1.5 rounded border border-amber-500/40 mt-1">
                              【神を騙す者 適用中】使用破壊で味方に身代わり蘇生を譲渡可能（自身の復活は不可）！
                            </div>
                          )}
                        </div>
                      )}

                      {previewItemStats.calculatedHeal && (
                        <div className="flex justify-between items-center text-xs font-mono pt-1 border-t border-zinc-800/60">
                          <span className="text-zinc-400 flex items-center gap-1">
                            実効回復量:
                          </span>
                          <span className={`font-bold ${previewItemStats.isHealModified ? 'text-emerald-400 font-black' : 'text-zinc-200'}`}>
                            +{previewItemStats.calculatedHeal} HP
                            {previewItemStats.isHealModified && isGluttonActive && (
                              <span className="text-[10px] text-red-400 ml-1">(グルトン-50%)</span>
                            )}
                          </span>
                        </div>
                      )}
                    </div>
                  )}

                  {/* 要約 ＆ 詳細説明 */}
                  <div className="border-t border-b border-zinc-800 py-2.5 text-left space-y-1.5">
                    <div className="text-xs font-mono font-bold text-yellow-400">
                      {previewItem.summary}
                    </div>
                    <p className="text-xs text-zinc-300 font-mono leading-relaxed">
                      {previewItem.description}
                    </p>
                  </div>

                  {/* バフ & デバフ */}
                  <div className="text-left space-y-2 font-mono text-xs">
                    {previewItem.buffs.length > 0 && (
                      <div className="space-y-1">
                        <span className="text-[11px] font-bold text-green-400">アイテム効果・バフ特性:</span>
                        <ul className="space-y-1 text-green-300/90 pl-1">
                          {previewItem.buffs.map((buff, i) => (
                            <li key={i} className="flex items-start gap-1">
                              <span className="text-green-500 font-bold shrink-0">[+]</span>
                              <span>{buff}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {previewItem.debuffs.length > 0 && (
                      <div className="space-y-1 pt-1">
                        <span className="text-[11px] font-bold text-red-400">ペナルティ・副作用:</span>
                        <ul className="space-y-1 text-red-300/90 pl-1">
                          {previewItem.debuffs.map((deb, i) => (
                            <li key={i} className="flex items-start gap-1">
                              <span className="text-red-500 font-bold shrink-0">[-]</span>
                              <span>{deb}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {/* パークとのシナジー解説 */}
                    {previewItem.synergyPerks && previewItem.synergyPerks.length > 0 && (
                      <div className="pt-2 border-t border-zinc-800 space-y-1">
                        <span className="text-[11px] font-bold text-cyan-400 flex items-center gap-1">
                          相乗効果のあるパーク:
                        </span>
                        <div className="flex flex-wrap gap-1">
                          {previewItem.synergyPerks.map(pId => {
                            const p = PERKS_DATA.find(x => x.id === pId);
                            if (!p) return null;
                            const isEquipped = equippedPerkIds.includes(p.id);
                            return (
                              <button
                                key={p.id}
                                onClick={() => {
                                  setPreviewPerkId(p.id);
                                  setPreviewItemId(null);
                                }}
                                className={`text-[10px] font-mono px-2 py-0.5 rounded border transition ${
                                  isEquipped
                                    ? 'bg-green-950 border-green-500 text-green-300 font-bold'
                                    : 'bg-zinc-900 border-zinc-700 text-zinc-300 hover:text-white'
                                }`}
                              >
                                {p.name} {isEquipped ? '(装備中)' : ''}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 装備ボタン */}
                  <div className="pt-2">
                    {equippedItemId === previewItem.id ? (
                      <button
                        onClick={() => handleToggleEquipItem(previewItem)}
                        className="w-full py-2.5 rounded-xl bg-red-950 border border-red-500/80 hover:bg-red-900 text-red-300 font-bold font-mono text-xs sm:text-sm transition shadow-lg"
                      >
                        手持ちから外す
                      </button>
                    ) : (
                      <button
                        onClick={() => handleToggleEquipItem(previewItem)}
                        className="w-full py-2.5 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-black font-black font-mono text-xs sm:text-sm transition shadow-lg shadow-yellow-500/20"
                      >
                        手持ちアイテムとして装備 (1枠)
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* 未選択時の案内プレースホルダー */}
              {!previewPerk && !previewItem && (
                <div className="bg-black border-2 border-zinc-800 rounded-2xl p-8 shadow-2xl text-center space-y-4 sticky top-5">
                  <div className="mx-auto w-24 h-24 bg-zinc-950 border border-zinc-800 rounded-2xl flex items-center justify-center text-zinc-600 shadow-inner">
                    <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                  </div>
                  <div className="space-y-1.5">
                    <h3 className="text-lg font-black text-white font-mono tracking-wide">
                      パーク ＆ アイテム未選択
                    </h3>
                    <p className="text-xs text-zinc-400 leading-relaxed max-w-xs mx-auto font-mono">
                      左側の一覧から気になるパークやアイテムをクリックすると、詳細・持続時間・バフ効果・相乗効果がここに表示されます。
                    </p>
                  </div>
                  <div className="pt-2 space-y-1 text-[11px] font-mono text-zinc-500 bg-zinc-900/80 p-3 rounded-xl border border-zinc-800 text-left">
                    <div>・パークPP: パーク一覧の上部で消費状況を確認</div>
                    <div>・アイテム: 手持ちスロットに1個装備可能</div>
                    <div>・分類切替: 通常 / パトロン / コラボ</div>
                    <div>・パーク効果（グルトン等）による持続時間2倍延長も自動計算</div>
                  </div>
                </div>
              )}

            </div>

          </div>
        </div>
      );
    }



    // =========================================================================
    // 最上位 App (タブ切替)
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('perks'); // 'perks' | 'slashers'

      return (
        <div className="p-4 sm:p-6 max-w-7xl mx-auto space-y-5">
          {/* 最上部 ナビゲーションヘッダー */}
          <header className="border border-zinc-800 bg-zinc-900/90 rounded-2xl p-4 sm:p-5 shadow-2xl">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="text-xs font-mono tracking-widest text-green-400 uppercase flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
                  SlashCo Tactical Operation Portal
                </div>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white flex items-center gap-2 mt-1">
                  <span>SlashCO 総合タクティカル・データベース</span>
                </h1>
                <p className="text-zinc-400 text-xs mt-0.5">
                  全36パークの自由構成シミュレーター ＆ 全19スラッシャーのパラメータ・特性・攻略データベース
                </p>
              </div>

              {/* タブ切り替えボタン */}
              <div className="flex items-center gap-2 bg-black p-1.5 rounded-2xl border border-zinc-800 shadow-inner">
                <button
                  onClick={() => setActiveTab('perks')}
                  className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2 transition-all ${
                    activeTab === 'perks'
                      ? 'bg-green-500 text-black shadow-lg shadow-green-500/20 scale-102'
                      : 'text-zinc-400 hover:text-white hover:bg-zinc-900'
                  }`}
                >
                  パーク・シミュレーター
                </button>
                <button
                  onClick={() => setActiveTab('slashers')}
                  className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2 transition-all ${
                    activeTab === 'slashers'
                      ? 'bg-red-500 text-black shadow-lg shadow-red-500/20 scale-102'
                      : 'text-zinc-400 hover:text-white hover:bg-zinc-900'
                  }`}
                >
                  スラッシャー図鑑
                </button>
              </div>
            </div>
          </header>

          {/* アクティブなタブのビューを表示 */}
          {activeTab === 'perks' ? <PerkSimulatorView /> : <SlasherDatabaseView />}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
